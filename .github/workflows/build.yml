name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # go-hid is cgo-only, so every build needs a C toolchain and libudev headers.
  # Building natively per architecture avoids cross-compiling against an arm64
  # sysroot, which is the fragile part of a hand-rolled cross build.
  CGO_ENABLED: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libudev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          make linux-${{ matrix.goarch }}
          file dist/cooler-lcd-linux-${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: cooler-lcd-linux-${{ matrix.goarch }}
          path: dist/cooler-lcd-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum cooler-lcd-linux-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cooler-lcd-linux-amd64
            dist/cooler-lcd-linux-arm64
            dist/SHA256SUMS
